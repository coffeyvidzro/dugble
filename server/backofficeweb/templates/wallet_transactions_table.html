{{define "wallet_transactions_table"}}
<table>
  <thead><tr><th>Created</th><th>Type</th><th>Amount</th><th>Balance after</th><th>Status</th><th>Description</th><th>Reference</th></tr></thead>
  <tbody>
  {{range .}}
    <tr><td>{{.CreatedAt.Format "2006-01-02 15:04"}}</td><td>{{.TransactionType}}</td><td>{{money .Amount}}</td><td>{{money .BalanceAfter}}</td><td>{{.Status}}</td><td>{{.Description}}</td><td><code>{{.ReferenceID}}</code></td></tr>
  {{else}}
    <tr><td colspan="7">No transactions found.</td></tr>
  {{end}}
  </tbody>
</table>
{{end}}
