{{template "layout_start" .}}
<table>
  <thead><tr><th>Team</th><th>Currency</th><th>Balance</th><th>Status</th><th>Updated</th><th>ID</th></tr></thead>
  <tbody>
  {{range .Data}}
    <tr><td>{{.TeamName}}</td><td>{{.Currency}}</td><td>{{money .Balance}}</td><td>{{.Status}}</td><td>{{.UpdatedAt.Format "2006-01-02 15:04"}}</td><td><code>{{.ID}}</code></td></tr>
  {{else}}
    <tr><td colspan="6">No wallets found.</td></tr>
  {{end}}
  </tbody>
</table>
{{template "layout_end" .}}
