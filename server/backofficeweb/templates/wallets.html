{{template "layout_start" .}}
<form class="filters" method="get">
  <label>Search <input type="search" name="q" value="{{.Filter.Query}}" placeholder="team name"></label>
  <label>Status <input type="search" name="status" value="{{.Filter.Status}}" placeholder="active"></label>
  <button type="submit">Filter</button>
  <a href="/wallets">Clear</a>
</form>
<table>
  <thead><tr><th>Team</th><th>Currency</th><th>Balance</th><th>Status</th><th>Updated</th><th>ID</th></tr></thead>
  <tbody>
  {{range .Data}}
    <tr><td><a href="/teams/{{.TeamID}}">{{.TeamName}}</a></td><td>{{.Currency}}</td><td><a href="/wallets/{{.ID}}">{{money .Balance}}</a></td><td>{{.Status}}</td><td>{{.UpdatedAt.Format "2006-01-02 15:04"}}</td><td><code>{{.ID}}</code></td></tr>
  {{else}}
    <tr><td colspan="6">No wallets found.</td></tr>
  {{end}}
  </tbody>
</table>
{{template "layout_end" .}}
