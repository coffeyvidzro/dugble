{{template "layout_start" .}}
<form class="filters" method="get">
  <label>Search <input type="search" name="q" value="{{.Filter.Query}}" placeholder="team, sender, country"></label>
  <label>Status <input type="search" name="status" value="{{.Filter.Status}}" placeholder="pending"></label>
  <button type="submit">Filter</button>
  <a href="/sender-ids">Clear</a>
</form>
<table>
  <thead><tr><th>Team</th><th>Name</th><th>Country</th><th>Status</th><th>Created</th><th>ID</th></tr></thead>
  <tbody>
  {{range .Data}}
    <tr><td>{{.TeamName}}</td><td>{{.Name}}</td><td>{{.CountryCode}}</td><td>{{.Status}}</td><td>{{.CreatedAt.Format "2006-01-02 15:04"}}</td><td><code>{{.ID}}</code></td></tr>
  {{else}}
    <tr><td colspan="6">No sender IDs found.</td></tr>
  {{end}}
  </tbody>
</table>
{{template "layout_end" .}}
