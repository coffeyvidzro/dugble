{{template "layout_start" .}}
{{$detail := .Data}}
<p><a href="/wallets/{{$detail.Wallet.ID}}">← Back to wallet</a></p>
<section class="detail-grid">
  <article><span>Team</span><strong><a href="/teams/{{$detail.Wallet.TeamID}}">{{$detail.Wallet.TeamName}}</a></strong></article>
  <article><span>Balance</span><strong>{{money $detail.Wallet.Balance}}</strong></article>
  <article><span>Status</span><strong>{{$detail.Wallet.Status}}</strong></article>
  <article><span>ID</span><strong><code>{{$detail.Wallet.ID}}</code></strong></article>
</section>
{{template "wallet_transactions_table" $detail.Transactions}}
{{template "layout_end" .}}
