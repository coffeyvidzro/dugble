name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time values only; never real secrets.
      BACKEND_URL: https://api.example.invalid
      NEXT_PUBLIC_BASE_URL: https://dugble.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unused files, exports and dependencies
        run: bun run knip
      - name: Unit tests
        run: bun test
      - name: Production build
        run: bun run build
