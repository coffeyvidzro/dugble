name: Temporary Atlas 1.3.0 upgrade

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  upgrade:
    if: github.head_ref == 'feat/product-delivery-scaffolding'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/product-delivery-scaffolding

      - name: Verify Atlas 1.3.0 image
        run: docker run --rm arigaio/atlas:1.3.0-alpine version

      - name: Update Compose image
        run: sed -i 's#arigaio/atlas:1.2.3-community-alpine#arigaio/atlas:1.3.0-alpine#' deploy/compose.yaml

      - name: Refresh Atlas checksum
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/server/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations

      - name: Commit upgrade and remove temporary workflow
        run: |
          rm .github/workflows/tmp-upgrade-atlas-1-3-0.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/compose.yaml server/migrations/atlas.sum .github/workflows/tmp-upgrade-atlas-1-3-0.yml
          git commit -m "chore(atlas): upgrade migration image to 1.3.0"
          git push origin HEAD:feat/product-delivery-scaffolding
