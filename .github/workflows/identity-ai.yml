name: Identity AI CI

on:
  push:
    branches:
      - main
    paths:
      - "services/identity-ai/**"
      - ".github/workflows/identity-ai.yml"
  pull_request:
    paths:
      - "services/identity-ai/**"
      - ".github/workflows/identity-ai.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/identity-ai/uv.lock

      - name: Set up Python
        run: uv python install 3.14.6

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
