name: Remove River tidy

on:
  pull_request:
    paths:
      - server/go.mod
      - server/go.sum
      - server/**/*.go
      - .github/workflows/remove-river-tidy.yml

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Tidy modules
        working-directory: server
        run: go mod tidy

      - name: Verify River is absent
        run: |
          ! grep -R --line-number --fixed-strings 'github.com/riverqueue/river' server/go.mod server/go.sum server --include='*.go'

      - name: Upload tidied modules
        uses: actions/upload-artifact@v7
        with:
          name: remove-river-tidy
          path: |
            server/go.mod
            server/go.sum
          retention-days: 1
