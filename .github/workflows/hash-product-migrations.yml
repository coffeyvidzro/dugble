name: Hash product migrations

on:
  push:
    branches:
      - feat/product-delivery-scaffolding
    paths:
      - .github/workflows/hash-product-migrations.yml

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Atlas
        uses: ariga/setup-atlas@v0

      - name: Regenerate migration checksum
        run: atlas migrate hash --dir file://server/migrations

      - name: Upload Atlas checksum
        uses: actions/upload-artifact@v4
        with:
          name: atlas-sum
          path: server/migrations/atlas.sum
          if-no-files-found: error
