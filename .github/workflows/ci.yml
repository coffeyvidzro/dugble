name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify sqlc generated code
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/database/sqlc

      - name: Run golangci-lint
        run: |
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/server \
            golangci/golangci-lint:v2.12.2 \
            golangci-lint run --config ../.golangci.yml ./... \
            > ../golangci-lint.log 2>&1
          status=$?
          cat ../golangci-lint.log
          exit $status

      - name: Upload golangci-lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golangci-lint-report
          path: golangci-lint.log
          retention-days: 1

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  docker:
    name: Docker and Compose gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify golangci-lint config
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/server \
            golangci/golangci-lint:v2.12.2 \
            golangci-lint config verify --config ../.golangci.yml

      - name: Validate Compose config
        run: docker compose --env-file .env.example -f compose.yml config --quiet

      - name: Apply migrations to fresh PostgreSQL
        run: |
          set +e
          docker compose --env-file .env.example -f compose.yml up \
            --abort-on-container-exit \
            --exit-code-from migrate \
            migrate > migration.log 2>&1
          status=$?
          cat migration.log
          exit $status

      - name: Upload migration logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: migration-logs
          path: migration.log
          retention-days: 1

      - name: Verify Caddy health and upstream routing
        run: |
          export API_DOMAIN=http://api.localhost
          export BACKOFFICE_DOMAIN=http://bo.localhost

          docker compose --env-file .env.example -f compose.yml up \
            --detach \
            --build \
            --wait \
            --wait-timeout 120 \
            caddy

          docker compose --env-file .env.example -f compose.yml ps

          curl --fail --silent --show-error \
            --header "Host: api.localhost" \
            http://127.0.0.1/ready \
            | tee api-ready.json
          grep -q '"status":"ready"' api-ready.json

          curl --fail --silent --show-error \
            --header "Host: bo.localhost" \
            http://127.0.0.1/ready \
            | tee backoffice-ready.json
          grep -q '"status":"ready"' backoffice-ready.json

      - name: Verify final SMS pricing schema
        run: |
          docker compose --env-file .env.example -f compose.yml exec -T postgres \
            sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          DO $$
          BEGIN
              IF NOT EXISTS (
                  SELECT 1
                  FROM information_schema.columns
                  WHERE table_schema = 'public'
                    AND table_name = 'sms_pricing_rules'
                    AND column_name = 'destination_country'
                    AND is_nullable = 'NO'
              ) THEN
                  RAISE EXCEPTION 'sms_pricing_rules.destination_country is missing or nullable';
              END IF;

              IF NOT EXISTS (
                  SELECT 1
                  FROM information_schema.columns
                  WHERE table_schema = 'public'
                    AND table_name = 'sms_messages'
                    AND column_name = 'destination_country'
                    AND is_nullable = 'NO'
              ) OR NOT EXISTS (
                  SELECT 1
                  FROM information_schema.columns
                  WHERE table_schema = 'public'
                    AND table_name = 'sms_messages'
                    AND column_name = 'pricing_rule_id'
                    AND is_nullable = 'NO'
              ) THEN
                  RAISE EXCEPTION 'sms_messages final pricing columns are missing or nullable';
              END IF;

              IF EXISTS (
                  SELECT 1
                  FROM information_schema.columns
                  WHERE table_schema = 'public'
                    AND (
                        (table_name IN ('sms_pricing_rules', 'sms_messages') AND column_name = 'traffic_class')
                        OR (
                            table_name = 'team_sms_settings'
                            AND column_name IN ('default_traffic_class', 'local_enabled', 'a2p_enabled')
                        )
                    )
              ) THEN
                  RAISE EXCEPTION 'legacy SMS pricing columns still exist';
              END IF;

              IF NOT EXISTS (
                  SELECT 1
                  FROM sms_pricing_rules
                  WHERE id = '9f6cb7f6-1a21-4a79-9aa8-9782c867a101'::uuid
                    AND pricing_plan_id = '9f6cb7f6-1a21-4a79-9aa8-9782c867a001'::uuid
                    AND destination_country = 'GH'
                    AND unit_cost_micros = 9000
                    AND status = 'active'
              ) THEN
                  RAISE EXCEPTION 'default Ghana SMS pricing rate is missing';
              END IF;
          END
          $$;
          SQL

      - name: Clean up Compose services
        if: always()
        run: docker compose --env-file .env.example -f compose.yml down -v --remove-orphans
