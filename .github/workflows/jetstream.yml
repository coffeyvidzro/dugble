name: JetStream Integration

on:
  push:
    branches:
      - main
    paths:
      - deploy/compose.yaml
      - deploy/nats-server.conf
      - .env.example
      - server/**
      - .github/workflows/jetstream.yml
  pull_request:
    paths:
      - deploy/compose.yaml
      - deploy/nats-server.conf
      - .env.example
      - server/**
      - .github/workflows/jetstream.yml

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet

      - name: Start worker and JetStream dependencies
        run: |
          docker compose --env-file .env.example -f deploy/compose.yaml up \
            --detach \
            --build \
            --wait \
            --wait-timeout 180 \
            worker

          docker compose --env-file .env.example -f deploy/compose.yaml ps

      - name: Verify JetStream health and topology
        run: |
          docker compose --env-file .env.example -f deploy/compose.yaml exec -T nats \
            wget -q -O /tmp/health.json \
            'http://127.0.0.1:8222/healthz?js-enabled-only=true'
          docker compose --env-file .env.example -f deploy/compose.yaml exec -T nats \
            cat /tmp/health.json

          docker compose --env-file .env.example -f deploy/compose.yaml exec -T nats \
            wget -q -O /tmp/jsz.json \
            'http://127.0.0.1:8222/jsz?streams=true&consumers=true&config=true'
          docker compose --env-file .env.example -f deploy/compose.yaml exec -T nats \
            cat /tmp/jsz.json > jetstream-topology.json

          grep -q 'DUGBLE_JOBS' jetstream-topology.json
          grep -q 'DUGBLE_EVENTS' jetstream-topology.json
          grep -q 'DUGBLE_DLQ' jetstream-topology.json
          grep -q 'sms-delivery-v1' jetstream-topology.json
          grep -q 'dugble-email-delivery-v1' jetstream-topology.json

      - name: Verify event publish, consume, and acknowledgement
        env:
          NATS_USER: dugble
          NATS_PASSWORD: replace-with-a-separate-long-random-password
        run: |
          set -euo pipefail

          subject="dugble.event.ci.probe.v1"
          consumer="ci-event-flow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          server="nats://${NATS_USER}:${NATS_PASSWORD}@nats:4222"
          nats_cli="docker run --rm --network dugble-network natsio/nats-box:0.19.2 nats --server ${server}"

          $nats_cli consumer add DUGBLE_EVENTS "$consumer" \
            --filter "$subject" \
            --ack explicit \
            --pull \
            --deliver all \
            --max-deliver 1 \
            --defaults

          $nats_cli pub "$subject" \
            "{\"event_id\":\"${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\",\"type\":\"ci.probe\"}"

          $nats_cli consumer next DUGBLE_EVENTS "$consumer" \
            --count 1 \
            --ack \
            --timeout 10s | tee jetstream-event-flow.log

          $nats_cli consumer info DUGBLE_EVENTS "$consumer" --json \
            | tee jetstream-consumer.json
          grep -Eq '"num_ack_pending"[[:space:]]*:[[:space:]]*0' jetstream-consumer.json

          $nats_cli consumer rm DUGBLE_EVENTS "$consumer" --force

      - name: Upload JetStream diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jetstream-diagnostics
          path: |
            jetstream-topology.json
            jetstream-event-flow.log
            jetstream-consumer.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Show service logs
        if: failure()
        run: |
          docker compose --env-file .env.example -f deploy/compose.yaml logs \
            --no-color \
            --tail=300 \
            postgres migrate nats worker

      - name: Clean up
        if: always()
        run: docker compose --env-file .env.example -f deploy/compose.yaml down -v --remove-orphans
