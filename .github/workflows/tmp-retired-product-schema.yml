name: Temporary retired product schema cleanup

on:
  push:
    branches:
      - refactor/retired-product-schema

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: refactor/retired-product-schema
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Remove retired product database surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm server/migrations/027_create_inbox.sql
          rm server/migrations/028_create_notify.sql
          mv server/migrations/029_extend_event_delivery.sql server/migrations/027_extend_event_delivery.sql

          rm -f server/internal/database/queries/inbox_*.sql
          rm -f server/internal/database/queries/notification_*.sql
          rm -f server/internal/database/sqlc/inbox_*.sql.go
          rm -f server/internal/database/sqlc/notification_*.sql.go

      - name: Regenerate sqlc artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          cd server
          "$RUNNER_TEMP/bin/sqlc" generate

      - name: Regenerate Atlas migration checksum
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/server/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations

      - name: Validate server
        shell: bash
        run: |
          set -euo pipefail
          cd server
          go test ./...

      - name: Commit generated cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-retired-product-schema.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(database): remove retired product schemas"
          git push origin HEAD:refactor/retired-product-schema
