name: Temporary Biome report

on:
  pull_request:
    paths:
      - web/**
      - .github/workflows/biome-report-temp.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile >/dev/null

      - name: Generate Biome report
        working-directory: web
        shell: bash
        run: |
          set +e
          bunx biome check --reporter=json > biome-report.json
          status=$?
          cat biome-report.json
          exit 0

      - name: Upload Biome report
        uses: actions/upload-artifact@v7
        with:
          name: biome-report
          path: web/biome-report.json
          retention-days: 1
