name: Temporary Atlas checksum generation

on:
  push:
    branches:
      - agent/fix-atlas-checksum

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v7

      - name: Generate Atlas checksum
        run: |
          docker run --rm \
            -v "$PWD/server/migrations:/migrations" \
            arigaio/atlas:1.2.3-community-alpine \
            migrate hash --dir file:///migrations

      - name: Verify checksum
        run: |
          docker run --rm \
            -v "$PWD/server/migrations:/migrations:ro" \
            arigaio/atlas:1.2.3-community-alpine \
            migrate validate --dir file:///migrations

      - name: Upload checksum
        uses: actions/upload-artifact@v7
        with:
          name: atlas-checksum-branch-head
          path: server/migrations/atlas.sum
          retention-days: 1
