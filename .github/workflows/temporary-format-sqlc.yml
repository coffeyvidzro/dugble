name: Temporary format and sqlc

on:
  push:
    branches:
      - feat/sns-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/sns-integration
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum
      - name: Format Go and regenerate sqlc
        run: |
          gofmt -w server
          cd server
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "format SES diagnostics and regenerate sqlc"
          git push origin HEAD:feat/sns-integration
