name: Gofmt Debug

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/gofmt-debug.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Format sender ID module
        run: gofmt -w internal/modules/senderid

      - name: Upload formatted module
        uses: actions/upload-artifact@v4
        with:
          name: gofmt-senderid
          path: server/internal/modules/senderid/*.go
