name: Temporary backoffice pricing format

on:
  push:
    branches:
      - agent/add-sms-traffic-pricing

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/add-sms-traffic-pricing

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Format Go code
        working-directory: server
        run: gofmt -w internal/backoffice/smspricing internal/transport/backoffice/pricing_handler.go internal/transport/backoffice/router.go

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/internal/backoffice/smspricing server/internal/transport/backoffice/pricing_handler.go server/internal/transport/backoffice/router.go
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format backoffice SMS pricing code"
          git push origin HEAD:agent/add-sms-traffic-pricing
