name: Gofmt Report

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/gofmt-report.yml"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Capture unformatted files
        run: gofmt -l . > ../gofmt-files.txt

      - name: Upload gofmt report
        uses: actions/upload-artifact@v4
        with:
          name: gofmt-report
          path: gofmt-files.txt
