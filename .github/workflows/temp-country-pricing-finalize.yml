name: Temporary country pricing finalizer

on:
  push:
    branches:
      - agent/add-sms-traffic-pricing

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/add-sms-traffic-pricing

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Apply country pricing cutover
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          service = Path('server/internal/modules/sms/service.go')
          text = service.read_text()
          replacements = {
              'quote, err := txRepository.QuoteSMS(ctx, tenantContext.TeamID, normalized.TrafficClass, segments)':
                  'quote, err := txRepository.QuoteSMS(ctx, tenantContext.TeamID, normalized.DestinationCountry, segments)',
              '''\t\tcase errors.Is(err, ErrTrafficClassNotEnabled):
\t\t\treturn Message{}, apperrors.NewForbidden("SMS traffic class is not enabled for this team")
\t\tcase errors.Is(err, ErrSMSPricingNotConfigured):
\t\t\treturn Message{}, apperrors.NewBadRequest("SMS pricing is not configured for the requested traffic class")''':
                  '''\t\tcase errors.Is(err, ErrSMSPricingNotConfigured):
\t\t\treturn Message{}, apperrors.NewBadRequest("SMS pricing is not configured for the destination country")''',
              '''\t\tTrafficClass: quote.TrafficClass, PricingRuleID: quote.PricingRuleID,
\t\tUnitCostMicros: quote.UnitCostMicros,''':
                  '''\t\tDestinationCountry: quote.DestinationCountry, PricingRuleID: quote.PricingRuleID,
\t\tUnitCostMicros: quote.UnitCostMicros,''',
              '\treq.TrafficClass = smsapi.NormalizeTrafficClass(req.TrafficClass)\n': '',
              '''\tif req.TrafficClass != "" && !smsapi.IsKnownTrafficClass(req.TrafficClass) {
\t\treturn SendRequest{}, apperrors.NewBadRequest("SMS traffic class must be local or a2p")
\t}
''': '',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing service replacement: {old[:80]!r}')
              text = text.replace(old, new)
          marker = '''\tif !e164Pattern.MatchString(req.To) {
\t\treturn SendRequest{}, apperrors.NewBadRequest("SMS recipient must be a valid E.164 phone number")
\t}
'''
          insertion = marker + '''\tdestinationCountry, err := smsapi.ResolveDestinationCountry(req.To)
\tif err != nil {
\t\treturn SendRequest{}, apperrors.NewBadRequest("SMS recipient country is not supported")
\t}
\treq.DestinationCountry = destinationCountry
'''
          if marker not in text:
              raise SystemExit('missing E.164 validation marker')
          text = text.replace(marker, insertion, 1)
          service.write_text(text)

          worker = Path('server/internal/delivery/sms/worker.go')
          text = worker.read_text()
          old = '''\tresponse, err := w.sender.Send(ctx, smsapi.SendRequest{
\t\tTo:           message.To,
\t\tFrom:         message.From,
\t\tMessage:      message.Body,
\t\tTrafficClass: message.TrafficClass,
\t})'''
          new = '''\tresponse, err := w.sender.Send(ctx, smsapi.SendRequest{
\t\tTo:                 message.To,
\t\tFrom:               message.From,
\t\tMessage:            message.Body,
\t\tDestinationCountry: message.DestinationCountry,
\t})'''
          if old not in text:
              raise SystemExit('missing worker traffic class block')
          worker.write_text(text.replace(old, new))

          tests = Path('server/internal/modules/sms/service_test.go')
          text = tests.read_text()
          text = text.replace('\n\t"github.com/google/uuid"\n', '\n')
          text = text.replace('\n\tsmsapi "github.com/coffeyvidzro/dugble/server/internal/integration/sms"\n', '\n')
          text = re.sub(
              r'func TestValidateSendNormalizesTrafficClass\(t \*testing\.T\) \{.*?\n\}\n\nfunc TestValidateSendRejectsUnknownTrafficClass\(t \*testing\.T\) \{.*?\n\}\n\n',
              '''func TestValidateSendResolvesDestinationCountry(t *testing.T) {
\treq, err := validateSend(SendRequest{To: "+233241234567", From: "DUGBLE", Body: "hello"})
\tif err != nil {
\t\tt.Fatalf("validateSend returned error: %v", err)
\t}
\tif req.DestinationCountry != "GH" {
\t\tt.Fatalf("DestinationCountry = %q, want GH", req.DestinationCountry)
\t}
}

func TestValidateSendRejectsUnsupportedDestination(t *testing.T) {
\t_, err := validateSend(SendRequest{To: "+12025550123", From: "DUGBLE", Body: "hello"})
\tif err == nil {
\t\tt.Fatal("validateSend returned nil error for unsupported destination")
\t}
}

''',
              text,
              flags=re.S,
          )
          text = re.sub(
              r'func TestResolveTrafficClassUsesTeamDefault\(t \*testing\.T\) \{.*?\n\}\n\nfunc TestResolveTrafficClassRejectsDisabledClass\(t \*testing\.T\) \{.*?\n\}\n\n',
              '',
              text,
              flags=re.S,
          )
          text = text.replace('\t\tTrafficClass:      smsapi.TrafficClassA2P,\n', '\t\tDestinationCountry: "GH",\n')
          text = text.replace('`"traffic_class":"a2p"`,', '`"destination":{"country":"GH"}`,')
          tests.write_text(text)

          Path('server/internal/backoffice/smspricing/rate_schedule.go').unlink(missing_ok=True)
          PY

      - name: Format Go code
        working-directory: server
        run: gofmt -w internal/backoffice/smspricing internal/delivery/sms internal/integration/sms internal/modules/sms internal/transport/backoffice

      - name: Generate sqlc
        working-directory: server
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Hash Atlas migrations
        working-directory: server
        run: |
          curl -sSf https://atlasgo.sh | sh
          atlas migrate hash --dir file://migrations

      - name: Verify traffic class removal
        run: |
          if grep -R -n -E 'TrafficClass|traffic_class|Traffic class|A2P rate|Local rate' \
            server/internal server/backofficeweb/templates \
            --include='*.go' --include='*.html'; then
            echo 'Legacy traffic-class references remain.' >&2
            exit 1
          fi

      - name: Test server
        working-directory: server
        run: go test ./...

      - name: Commit finalized refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize country-based SMS pricing"
          git push origin HEAD:agent/add-sms-traffic-pricing
