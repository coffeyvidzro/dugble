name: Temporary retired product scaffolding cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-retired-product-scaffolding
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Remove retired product packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            server/internal/delivery/inbox \
            server/internal/delivery/notify \
            server/internal/modules/inbox \
            server/internal/modules/notify \
            server/internal/modules/events \
            server/internal/platform/realtime \
            server/internal/transport/realtime \
            server/internal/dugble/worker

          while IFS= read -r directory; do
            rm -rf "$directory"
          done < <(find server/internal -type d -name realtime -print)

      - name: Remove retired permissions and product descriptions
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          retired_permissions = ("PermissionInbox", "PermissionNotify", "PermissionEvents")
          for filename in (
              "server/internal/platform/tenant/permissions.go",
              "server/internal/platform/tenant/permissions_test.go",
              "server/internal/modules/teamtoken/service.go",
              "server/internal/modules/teamtoken/validation_test.go",
          ):
              path = Path(filename)
              lines = path.read_text().splitlines(keepends=True)
              path.write_text("".join(
                  line for line in lines
                  if not any(permission in line for permission in retired_permissions)
              ))

          permissions_test = Path("server/internal/platform/tenant/permissions_test.go")
          permissions_test.write_text(
              permissions_test.read_text().replace(
                  "TestProductRuntimePermissionsByRole",
                  "TestVerifyPermissionsByRole",
              )
          )

          token_test = Path("server/internal/modules/teamtoken/validation_test.go")
          token_test.write_text(
              token_test.read_text().replace(
                  "TestValidatePermissionsAllowsProductRuntimeScopes",
                  "TestValidatePermissionsAllowsVerifyScopes",
              )
          )

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = readme.replace(
              "Dugble is a multi-tenant communications platform for African startups and teams. It combines browser authentication, team-scoped API tokens, email and SMS delivery, verification, notification workflows, in-app inboxes, webhooks, and operational tooling.",
              "Dugble is a multi-tenant communications platform for African startups and teams. It combines browser authentication, team-scoped API tokens, Email, SMS, Verify, webhooks, and operational tooling.",
          )
          notify_start = readme.index("### Dugble Notify")
          collaboration_start = readme.index("## How the products work together")
          readme = readme[:notify_start] + readme[collaboration_start:]

          architecture_start = readme.index("## Architecture")
          collaboration = """## How the products work together

```text
Customer application
        |
        v
Dugble Verify
    |       |
    v       v
 Email    SMS

Email, SMS, and Verify lifecycle changes
        |
        v
Signed customer webhooks
```

"""
          collaboration_heading = readme.index("## How the products work together")
          readme = readme[:collaboration_heading] + collaboration + readme[architecture_start:]
          readme = readme.replace(
              "| Verify, Notify, and Inbox products | Planned |",
              "| Verify API | Implemented; production-readiness hardening in progress |",
          )
          readme_path.write_text(readme)
          PY

          gofmt -w \
            server/internal/platform/tenant/permissions.go \
            server/internal/platform/tenant/permissions_test.go \
            server/internal/modules/teamtoken/service.go \
            server/internal/modules/teamtoken/validation_test.go

      - name: Audit retired server surfaces
        shell: bash
        run: |
          set -euo pipefail

          remaining_directories="$(find server/internal -type d \( -name inbox -o -name notify -o -name events -o -name realtime \) -print)"
          if [[ -n "$remaining_directories" ]]; then
            echo "Retired product directories remain:"
            echo "$remaining_directories"
            exit 1
          fi

          patterns=(
            'server/internal/delivery/inbox'
            'server/internal/delivery/notify'
            'server/internal/modules/inbox'
            'server/internal/modules/notify'
            'server/internal/modules/events'
            'server/internal/platform/realtime'
            'server/internal/transport/realtime'
            'PermissionInbox'
            'PermissionNotify'
            'PermissionEvents'
            '"inbox:'
            '"notify:'
            '"events:'
            'Dugble Inbox'
            'Dugble Notify'
            'Dugble Events'
          )
          for pattern in "${patterns[@]}"; do
            if git grep -n -F "$pattern" -- server README.md docs; then
              echo "Retired product reference remains: $pattern"
              exit 1
            fi
          done

          test -d server/internal/integration/sms/provider/mnotify
          git grep -n -F 'MNotify' -- server/internal/config/config.go >/dev/null

      - name: Validate server
        shell: bash
        run: |
          set -euo pipefail
          cd server
          go test ./...

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-remove-retired-scaffolding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(server): remove retired product scaffolding"
          git push origin HEAD:refactor/remove-retired-product-scaffolding
