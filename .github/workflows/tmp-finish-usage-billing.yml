name: Temporary usage billing generation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'fix/usage-allowance-schema'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/usage-allowance-schema
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Normalize SQLC projections
        run: sed -i 's/SELECT authorization\.\*/SELECT */g' server/internal/database/queries/billing.sql

      - name: Refresh Atlas checksum
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/server/migrations:/migrations" \
            arigaio/atlas:1.3.0-alpine \
            migrate hash --dir file:///migrations

      - name: Regenerate sqlc output
        working-directory: server
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Format Go files
        working-directory: server
        run: gofmt -w internal/platform/billing internal/modules/wallet internal/database/billing_integration_test.go

      - name: Commit generated output and remove temporary workflow
        run: |
          rm .github/workflows/tmp-finish-usage-billing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/migrations/atlas.sum server/internal/database/queries/billing.sql \
            server/internal/database/sqlc server/internal/platform/billing \
            server/internal/modules/wallet server/internal/database/billing_integration_test.go \
            .github/workflows/tmp-finish-usage-billing.yml
          git commit -m "fix(billing): regenerate usage authorization artifacts"
          git push origin HEAD:fix/usage-allowance-schema
