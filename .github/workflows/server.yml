name: Server CI

on:
  push:
    branches:
      - main
    paths:
      - ".env.example"
      - ".golangci.yml"
      - ".github/workflows/server.yml"
      - "go.work"
      - "go.work.sum"
      - "server/**"
      - "deploy/compose.yaml"
      - "deploy/Caddyfile"
  pull_request:
    paths:
      - ".env.example"
      - ".golangci.yml"
      - ".github/workflows/server.yml"
      - "go.work"
      - "go.work.sum"
      - "server/**"
      - "deploy/compose.yaml"
      - "deploy/Caddyfile"

permissions:
  contents: read

jobs:
  server:
    name: Server quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify sqlc generated code
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/database/sqlc

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Verify golangci-lint config
        run: golangci-lint config verify --config ../.golangci.yml

      - name: Run golangci-lint
        run: golangci-lint run --config ../.golangci.yml ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  integration:
    name: Hosted PostgreSQL and JetStream integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dugble
          POSTGRES_PASSWORD: dugble
          POSTGRES_DB: dugble_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dugble -d dugble_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTEGRATION_DATABASE_URL: postgres://dugble:dugble@127.0.0.1:5432/dugble_integration?sslmode=disable
      INTEGRATION_NATS_URL: nats://127.0.0.1:4222
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Start JetStream
        run: |
          docker run --detach --rm \
            --name dugble-integration-nats \
            --publish 4222:4222 \
            nats:2.14.3-alpine \
            --jetstream \
            --store_dir /tmp/nats/jetstream

      - name: Wait for JetStream
        run: |
          for attempt in $(seq 1 30); do
            if bash -c 'exec 3<>/dev/tcp/127.0.0.1/4222'; then
              exit 0
            fi
            sleep 1
          done
          docker logs dugble-integration-nats
          exit 1

      - name: Apply SQL migrations
        run: |
          for migration in migrations/*.sql; do
            echo "Applying ${migration}"
            psql "$INTEGRATION_DATABASE_URL" \
              --set ON_ERROR_STOP=1 \
              --file "$migration"
          done

      - name: Run hosted integration tests
        run: go test -race -tags=integration ./internal/delivery/email/feedback -run '^TestHostedPostgres'

      - name: Show JetStream logs
        if: failure()
        run: docker logs dugble-integration-nats

      - name: Stop JetStream
        if: always()
        run: docker stop dugble-integration-nats || true

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet

      - name: Apply migrations
        run: |
          set +e
          docker compose --env-file .env.example -f deploy/compose.yaml up \
            --abort-on-container-exit \
            --exit-code-from migrate \
            migrate > migration.log 2>&1
          status=$?
          cat migration.log
          exit $status

      - name: Upload migration logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: migration-logs
          path: migration.log
          retention-days: 1

      - name: Start application stack
        run: |
          export API_DOMAIN=http://api.localhost
          export BACKOFFICE_DOMAIN=http://bo.localhost

          docker compose --env-file .env.example -f deploy/compose.yaml up \
            --detach \
            --build \
            --wait \
            --wait-timeout 120 \
            caddy

          docker compose --env-file .env.example -f deploy/compose.yaml ps

      - name: Verify server readiness
        run: |
          curl --fail --silent --show-error \
            --header "Host: api.localhost" \
            http://127.0.0.1/ready \
            | tee api-ready.json
          grep -q '"status":"ready"' api-ready.json

          curl --fail --silent --show-error \
            --header "Host: bo.localhost" \
            http://127.0.0.1/ready \
            | tee backoffice-ready.json
          grep -q '"status":"ready"' backoffice-ready.json

      - name: Show service logs
        if: failure()
        run: |
          docker compose --env-file .env.example -f deploy/compose.yaml logs \
            --no-color \
            --tail=300 \
            postgres migrate redis server backoffice caddy

      - name: Clean up Compose services
        if: always()
        run: docker compose --env-file .env.example -f deploy/compose.yaml down -v --remove-orphans
