name: Temporary integration formatter

on:
  push:
    branches:
      - feat/sns-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/sns-integration
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum
      - name: Format integration and metrics code
        run: gofmt -w server
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "format hosted integration tests and metrics"
          git push origin HEAD:feat/sns-integration
