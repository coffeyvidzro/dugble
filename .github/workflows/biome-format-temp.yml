name: Temporary Biome formatting

on:
  pull_request:
    paths:
      - web/src/app/(auth)/layout.tsx
      - .github/workflows/biome-format-temp.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile >/dev/null

      - name: Apply Biome fixes
        working-directory: web
        run: bunx biome check --write 'src/app/(auth)/layout.tsx'

      - name: Upload formatted layout
        uses: actions/upload-artifact@v7
        with:
          name: formatted-auth-layout
          path: web/src/app/(auth)/layout.tsx
          retention-days: 1
