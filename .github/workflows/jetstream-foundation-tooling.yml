name: JetStream foundation tooling

on:
  pull_request:
    paths:
      - server/**
      - .github/workflows/jetstream-foundation-tooling.yml

permissions:
  contents: read

jobs:
  generate-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Generate dependency and formatting artifacts
        working-directory: server
        run: |
          go mod tidy
          gofmt -w \
            cmd/worker/main.go \
            internal/config/config.go \
            internal/messaging/jetstream \
            internal/messaging/outbox

      - name: Generate Atlas checksum
        run: |
          docker run --rm \
            -v "$PWD/server/migrations:/migrations" \
            arigaio/atlas:1.2.3-community-alpine \
            migrate hash --dir file:///migrations

      - name: Upload generated files
        uses: actions/upload-artifact@v7
        with:
          name: jetstream-foundation-generated
          path: |
            server/go.mod
            server/go.sum
            server/migrations/atlas.sum
            server/cmd/worker/main.go
            server/internal/config/config.go
            server/internal/messaging/jetstream
            server/internal/messaging/outbox
          retention-days: 1

      - name: Run focused tests
        working-directory: server
        run: go test ./internal/messaging/... ./cmd/worker

      - name: Vet server
        working-directory: server
        run: go vet ./...
