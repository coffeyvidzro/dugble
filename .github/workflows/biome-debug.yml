name: Biome Debug

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/biome-debug.yml"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Bun install
        run: bun install --frozen-lockfile

      - name: Format sender ID manager
        run: bunx biome format --write src/components/dashboard/sender-id-manager.tsx

      - name: Stage formatted file
        run: cp src/components/dashboard/sender-id-manager.tsx ../sender-id-manager.tsx

      - name: Upload formatted file
        uses: actions/upload-artifact@v4
        with:
          name: biome-formatted
          path: sender-id-manager.tsx
