name: Biome Debug

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/biome-debug.yml"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Bun install
        run: bun install --frozen-lockfile

      - name: Capture Biome diagnostics
        run: bunx biome check --reporter=json . > ../biome-report.json 2>&1 || true

      - name: Upload Biome report
        uses: actions/upload-artifact@v4
        with:
          name: biome-report
          path: biome-report.json
