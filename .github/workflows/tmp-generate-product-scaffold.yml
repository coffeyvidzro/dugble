name: Temporary product scaffold generation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'feat/product-delivery-scaffolding'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/product-delivery-scaffolding

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Refresh Atlas checksum
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/server/migrations:/migrations" \
            arigaio/atlas:latest \
            migrate hash --dir file:///migrations

      - name: Regenerate sqlc output
        working-directory: server
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Commit generated output and remove temporary workflow
        run: |
          rm .github/workflows/tmp-generate-product-scaffold.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/migrations/atlas.sum server/internal/database/sqlc .github/workflows/tmp-generate-product-scaffold.yml
          git commit -m "chore(server): refresh migration and sqlc artifacts"
          git push origin HEAD:feat/product-delivery-scaffolding
