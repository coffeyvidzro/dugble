name: Temporary SMS pricing lifecycle generation

on:
  push:
    branches:
      - agent/add-sms-traffic-pricing

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/add-sms-traffic-pricing

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Apply source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('server/internal/backoffice/smspricing/service.go')
          text = service.read_text()
          text = text.replace('s.repository.PricingAudit(ctx, "plan", id)', 's.repository.PlanAudit(ctx, id)')
          service.write_text(text)

          management = Path('server/internal/backoffice/smspricing/management.go')
          text = management.read_text()
          text = text.replace("AND ($5 = '' OR id <> $5::uuid)", "AND (NULLIF($5, '') IS NULL OR id <> NULLIF($5, '')::uuid)")
          management.write_text(text)
          PY

      - name: Format Go code
        working-directory: server
        run: gofmt -w internal/backoffice/smspricing internal/transport/backoffice

      - name: Generate sqlc
        working-directory: server
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Hash Atlas migrations
        working-directory: server
        run: |
          curl -sSf https://atlasgo.sh | sh
          atlas migrate hash --dir file://migrations

      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/internal/backoffice/smspricing server/internal/transport/backoffice server/internal/database/sqlc server/migrations/atlas.sum
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize SMS pricing lifecycle management"
          git push origin HEAD:agent/add-sms-traffic-pricing
