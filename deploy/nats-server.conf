server_name: $NATS_SERVER_NAME
port: 4222
http_port: 8222
max_payload: 1MB

cluster {
    name: dugble
    port: 6222
    routes: [
        nats-route://nats-1:6222,
        nats-route://nats-2:6222,
        nats-route://nats-3:6222
    ]
}

jetstream {
    store_dir: /data/jetstream
    max_memory_store: 512MB
    max_file_store: 25GB
}
